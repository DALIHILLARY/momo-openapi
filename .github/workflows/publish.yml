# Publishes momo-openapi to PyPI with Trusted Publishing, so no API token is stored anywhere.
# The PyPI publisher must match: owner DALIHILLARY, repository mtn-momo-api,
# workflow publish.yml, environment pypi.
#
# To release: bump __version__ in src/momo_openapi/_version.py, then publish a
# GitHub release tagged v<version>, e.g. v0.1.1.
name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Check the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/momo_openapi/_version.py)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match __version__ $version in src/momo_openapi/_version.py"
            exit 1
          fi

      - name: Run tests
        run: uv run --extra dev pytest

      - name: Build
        run: uv build

      - name: Check the distributions
        run: |
          uvx twine check --strict dist/*
          tar -tzf dist/*.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/momo-openapi/
    permissions:
      id-token: write  # exchanged with PyPI for a short-lived upload token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
