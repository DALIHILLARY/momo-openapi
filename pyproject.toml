[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "momo-openapi"
dynamic = ["version"]
description = "Python client for the MTN MoMo Open API, ready for the momoapi.momo.africa platform migration."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Dali Hillary", email = "hillary@zem.bo" }]
keywords = ["mtn", "momo", "mobile money", "payments", "collections", "disbursements", "remittance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]
dev = ["pytest>=7", "responses>=0.23", "python-dotenv>=1.0", "tenacity>=8"]

[project.scripts]
momo-openapi = "momo_openapi.cli:main"

[tool.hatch.version]
path = "src/momo_openapi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/momo_openapi"]

# Explicit list so nothing else in the working tree (e.g. partner PDFs) ends up in the sdist.
[tool.hatch.build.targets.sdist]
only-include = ["src/momo_openapi", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml", ".env.example"]

# python-semantic-release picks the next version from Conventional Commits since the last v* tag.
[tool.semantic_release]
version_variables = ["src/momo_openapi/_version.py:__version__"]
commit_message = "chore(release): {version}"
allow_zero_version = true
# While on 0.x, a breaking change bumps the minor version instead of releasing 1.0.0.
major_on_zero = false
# The workflow builds with uv after the release commit.
build_command = ""

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
exclude_commit_patterns = ['''^(?:build|chore|ci|style|test)(?:\([^)]*\))?:''']

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: sends real requests to MoMo; needs MOMO_LIVE_TESTS=1 and credentials"]
